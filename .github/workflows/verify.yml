name: Verify public benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tracks.core.test_protocol
      - run: python verify_release.py
      - run: for script in docs/*.js; do node --check "$script"; done
