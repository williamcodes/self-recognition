name: Verify public benchmark
on: [push, pull_request]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tracks/core/test_*.py
      - run: python -m unittest discover -s tracks/group
      - name: Verify participant negotiation panels and published page
        working-directory: experiments/participant-negotiations
        run: |
          python matched.py
          python cross_family.py
          python ab.py
          python publish_ab.py
          python publish.py
          git diff --exit-code -- ../../docs/participant-negotiations.html ../../docs/negotiation-ab.html
      - run: python verify_release.py
      - run: for script in docs/*.js; do node --check "$script"; done
