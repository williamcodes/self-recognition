<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lawn Bowls League · Scorebook</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#1a3931;font:16px/1.5 Arial,sans-serif}header{background:#173d32;color:#fff;padding:18px max(5vw,calc((100vw - 1140px)/2));display:flex;align-items:center;gap:12px;font-weight:bold;letter-spacing:.03em}.mark{width:31px;height:31px;border:2px solid #cee29c;border-radius:50%;display:grid;place-items:center}.mark:after{content:'';width:13px;height:13px;border:2px solid #cee29c;border-radius:50%;margin-left:7px}main{max-width:1200px;margin:auto;padding:40px 30px}h1,h2{font-family:Georgia,serif;font-weight:normal;line-height:1.1}h1{font-size:clamp(44px,6vw,76px);margin:0;letter-spacing:-.05em}h2{font-size:33px;margin:0}p{margin:9px 0;color:#52665d}.intro,.heading,.match,.roundhead{display:flex;align-items:center;justify-content:space-between;gap:12px}.intro{border-bottom:1px solid #bac6b7;padding-bottom:25px;margin-bottom:28px}.columns{display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start}section{background:#fffefa;border:1px solid #d4dace;border-radius:12px;padding:24px}.heading{margin-bottom:22px}button{font:inherit;font-size:14px;font-weight:bold;background:#214b3b;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ad8415;outline-offset:3px}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:13px 5px;border-bottom:1px solid #dce0d7}thead th{background:#eef1e8;font-size:12px;color:#4b6255}th:nth-child(-n+2),td:first-child,tbody th{text-align:left}tbody td:last-child{color:#214b3b;font-weight:bold;background:#f1f5e9}.note,.status{font-size:13px}.roundhead{background:#edf1e7;border-radius:4px;padding:7px 10px;margin:15px 0 3px}.roundhead span{font-size:12px}.match{display:grid;grid-template-columns:1fr 46px 9px 46px 1fr;gap:6px;padding:9px 0;border-bottom:1px solid #e4e6dc}.match b{font-size:14px}.match b:last-child{text-align:right}input{width:100%;padding:6px 0;border-radius:4px;border:1px solid #adbbae;background:#fffefa;color:inherit;text-align:center;font:inherit}.actions{margin-top:18px}.status{min-height:1.5em}button:hover{background:#30614b}@media(max-width:900px){.columns{grid-template-columns:1fr}main{padding:28px 4vw}section{padding:18px}}@media(max-width:470px){.intro{align-items:flex-start;flex-direction:column}.scroll{overflow:auto}th,td{padding:11px 3px;font-size:13px}}@media print{body,header,section{background:white;color:black}header{padding:0}.mark,.intro button,#fixtures,.status{display:none}main{padding:20px 0}.columns{display:block}section{border:0;padding:0}.intro{margin-bottom:16px}h1{font-size:36px}}
</style></head><body><header><span class="mark" aria-hidden="true"></span>Lawn Bowls League</header><main><div class="intro"><div><h1>League scorebook</h1><p id="progress"></p></div><button id="print">Print league table</button></div><div class="columns"><section aria-labelledby="st"><div class="heading"><h2 id="st">Standings</h2></div><div class="scroll"><table aria-label="League standings"><thead><tr><th>Rank</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>For</th><th>Agst</th><th>Diff</th><th>Pts</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">Win 2 points · Draw 1 point · Unplayed 0 points</p><p class="note">Ties are decided by score difference, then scores for. Teams still level share a rank.</p></section><section id="fixtures"><h2>Match scores</h2><p class="note">Enter both scores, or clear both to mark a match unplayed.</p><form id="form"><div id="rounds"></div><div class="actions"><button>Save scores</button></div></form><p class="status" id="status" role="status"></p></section></div></main>
<script>
'use strict';
const fixtures=[['Cedar','Fern'],['Lark','Moss'],['Reed','Wren'],['Cedar','Lark'],['Fern','Reed'],['Moss','Wren']];
const seed=[[14,9],[11,11],[8,13],[10,12],[15,10],[null,null]];
const key='lawn-bowls-six.scorebook.v1';
const el=id=>document.getElementById(id);
let scores=seed;
function valid(pair){return Array.isArray(pair)&&pair.length===2&&(pair.every(n=>n===null)||pair.every(n=>Number.isInteger(n)&&n>=0&&n<=999999))}
try{const raw=localStorage.getItem(key);if(raw!==null){const saved=JSON.parse(raw);if(!Array.isArray(saved)||saved.length!==6||!saved.every(valid))throw Error();scores=saved}}
catch{el('status').textContent='Saved scores could not be loaded. Showing the original results.'}
function standings(results){
 const teams=new Map(fixtures.flat().map(name=>[name,{name,p:0,w:0,d:0,l:0,f:0,a:0,diff:0,pts:0}]));
 results.forEach((pair,i)=>{if(pair[0]===null)return;
 fixtures[i].forEach((name,j)=>{const t=teams.get(name),f=pair[j],a=pair[1-j];t.p++;t.f+=f;t.a+=a;t.diff+=f-a;if(f>a){t.w++;t.pts+=2}else if(f===a){t.d++;t.pts++}else t.l++})});
 const sorted=[...teams.values()].sort((a,b)=>b.pts-a.pts||b.diff-a.diff||b.f-a.f||a.name.localeCompare(b.name));
 sorted.forEach((t,i)=>{const prev=sorted[i-1];t.rank=prev&&prev.pts===t.pts&&prev.diff===t.diff&&prev.f===t.f?prev.rank:i+1});return sorted
}
function render(){el('rows').innerHTML=standings(scores).map(t=>`<tr><td>${t.rank}</td><th scope="row">${t.name}</th>${[t.p,t.w,t.d,t.l,t.f,t.a,t.diff>0?'+'+t.diff:t.diff,t.pts].map(n=>'<td>'+n+'</td>').join('')}</tr>`).join('');
 el('progress').textContent='6 teams · '+scores.filter(s=>s[0]!==null).length+' of 6 matches played';
 for(let r=0;r<2;r++)el('count'+r).textContent=scores.slice(3*r,3*r+3).filter(s=>s[0]!==null).length+' / 3 played'
}
el('rounds').innerHTML=fixtures.map((names,i)=>{const round=Math.floor(i/3)+1;
 const input=j=>`<input aria-label="Round ${round}, ${names[j]} score against ${names[1-j]}" id="s${i}${j}" inputmode="numeric" pattern="[0-9]{1,6}" title="Enter a whole number from 0 to 999999" placeholder="–" value="${scores[i][j]??''}">`;
 return (i%3===0?`<div class="roundhead"><strong>Round ${round}</strong><span id="count${round-1}"></span></div>`:'')+`<div class="match"><b>${names[0]}</b>${input(0)}–${input(1)}<b>${names[1]}</b></div>`}).join('');
render();
el('form').oninput=()=>{el('status').textContent='Unsaved score changes.'};
el('form').onsubmit=e=>{e.preventDefault();const next=[];
 for(let i=0;i<fixtures.length;i++){const pair=[0,1].map(j=>el('s'+i+j).value).map(s=>s===''?null:Number(s));if(!valid(pair)){el('status').textContent='Enter both scores for '+fixtures[i].join(' versus ')+', or clear both.';el('s'+i+pair.indexOf(null)).focus();return}next.push(pair)}
 scores=next;render();try{localStorage.setItem(key,JSON.stringify(scores));el('status').textContent='Scores saved on this device.'}catch{el('status').textContent='Standings updated for this session. Browser storage is unavailable.'}};
el('print').onclick=()=>window.print();
</script></body></html>
