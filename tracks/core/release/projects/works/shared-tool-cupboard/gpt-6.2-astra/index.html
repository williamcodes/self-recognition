25px;color:#203831;background:#fffef9}dialog::backdrop{background:#112e26a6}dialog form{display:grid;gap:16px}dialog .actions{justify-content:flex-end}.error{color:#843b21;background:#fbecdf;border-radius:6px;padding:9px}.error:empty,#notice:empty{display:none}#notice{padding:10px 15px;background:#e7efde;margin-top:15px;border-radius:8px}.meta{color:#58695f;font-size:14px}.range+div{margin-top:14px}.button-small{min-height:36px;font-size:13px}#printout{display:none}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.heading{align-items:flex-start;flex-wrap:wrap}}@media(max-width:600px){.hero{padding:24px;min-height:158px}.heroart{display:none}.top{height:57px}.brand{font-size:17px}.offline{font-size:11px}.art{height:110px}.cards{gap:10px}.details{padding:12px}.details h3{font-size:21px}.actions{flex-wrap:wrap;gap:8px}nav{gap:0}nav button{font-size:13px;padding:12px 9px}nav svg.icon{display:none}.entry{align-items:flex-start;flex-wrap:wrap}.panel{padding:14px}.panelhead{flex-wrap:wrap}.heading h2{font-size:27px}footer{flex-wrap:wrap}}

<script>
'use strict';
const items=[
 {id:'T-01',name:'Folding table',kind:'table',cap:1,bg:'#e4e9d5'},
 {id:'T-02',name:'Folding table',kind:'table',cap:1,bg:'#eae4d3'},
 {id:'P-01',name:'Projector',kind:'projector',cap:1,bg:'#dfe9e7'},
 {id:'Cords',name:'Extension cords',kind:'cord',cap:3,bg:'#f3e4d7'}
];
const $=s=>document.querySelector(s),item=id=>items.find(x=>x.id===id);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function date(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function offset(n){const d=new Date();d.setDate(d.getDate()+n);return date(d)}
function fmt(s){return new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
const left=r=>r.qty-r.returns.reduce((s,x)=>s+x.qty,0);
function occupied(r,d){
 if(d<r.start)return 0;
 if(r.kind==='reservation')return d<=r.end?r.qty:0;
 const returned=r.returns.filter(x=>x.day<=d).reduce((s,x)=>s+x.qty,0);
 if(d<=date()||d<=r.end||r.end<date())return r.qty-returned;
 return 0;
}
// Usage can rise only on a record's start date.
function availability(all,it,start,end,skip){
 const relevant=all.filter(r=>r.item===it.id&&r.id!==skip);
 let used=0,blockers=[],peakDay=start;
 for(const d of new Set([start,...relevant.map(r=>r.start).filter(d=>d>=start&&d<=end)])){
  const active=relevant.filter(r=>occupied(r,d)>0);
  const sum=active.reduce((n,r)=>n+occupied(r,d),0);
  if(sum>used){used=sum;blockers=active;peakDay=d}
 }
 return {free:Math.max(0,it.cap-used),blockers,peakDay};
}
function why(a){return 'On '+fmt(a.peakDay)+', '+a.blockers.map(r=>r.house+' has '+occupied(r,a.peakDay)+' on '+(r.kind==='loan'?'loan':'reservation')+' ('+fmt(r.start)+' – '+fmt(r.end)+(r.kind==='loan'&&left(r)&&r.end<date()?', overdue':'')+')').join(' and ')+'.'}
let db,records=[],tab='Inventory',mode,target,rangeStart=date(),rangeEnd=date(),refreshID=0;
const channel=typeof BroadcastChannel==='function'?new BroadcastChannel('cupboard-ledger'):null;
function notice(msg){$('#notice').textContent=msg}
async function refresh(){
 if(!db)return;
 const id=++refreshID,req=db.transaction('ledger').objectStore('ledger').getAll();
 req.onsuccess=()=>{if(id===refreshID){records=req.result;render()}};
 req.onerror=()=>notice('Could not read the ledger. Reopen this page to retry.');
}
function commit(change){
 return new Promise((resolve,reject)=>{
 const tx=db.transaction('ledger','readwrite'),store=tx.objectStore('ledger'),read=store.getAll();let fault;
 read.onsuccess=()=>{try{change(read.result,store)}catch(e){fault=e;tx.abort()}};
 tx.oncomplete=()=>{channel?.postMessage('changed');refresh();resolve()};
 tx.onabort=()=>reject(fault||new Error('Saving failed. Check browser storage and retry.'));
 });
}
const pill=(label,warn=false)=>'<span class="pill '+(warn?'warn':'')+'"><i></i>'+label+'</span>';
const action=(label,op,primary=false,ico='',id='')=>'<button type="button" class="btn '+(primary?'primary':'')+'" data-op="'+op+'" data-id="'+id+'">'+(ico?icon(ico):'')+label+'</button>';
function head(title,sub,buttons=''){return '<div class="heading"><div><h2>'+title+'</h2><p class="sub">'+sub+'</p></div><div class="actions">'+buttons+'</div></div>'}
function entries(rows,isLoan){
 if(!rows.length)return '<div class="empty"><strong>No '+(isLoan?'current loans':'reservations')+'</strong><p>'+(isLoan?'Checked-out equipment will appear here.':'Reserved equipment will appear here.')+'</p></div>';
 return [...rows].sort((a,b)=>(isLoan?a.end:a.start).localeCompare(isLoan?b.end:b.start)).map(r=>{
 const it=item(r.item),late=r.end<date();
 return '<article class="entry"><div><strong>'+esc(r.house)+'</strong> · '+it.name+' <span class="meta">'+(it.cap===1?r.item:'× '+left(r))+'</span><div class="meta">'+(isLoan?'Out ':'From ')+fmt(r.start)+' · '+(isLoan?'Due ':'Through ')+fmt(r.end)+'</div></div><div class="actions">'+(late?pill(isLoan?'Overdue':'Expired',true):'')+(isLoan?action('Record return','return',false,'',r.id):((r.start<=date()&&!late?action('Check out','pickup',true,'',r.id):'')+action('Cancel','cancel',false,'',r.id)))+'</div></article>'}).join('');
}
function render(){
 const loans=records.filter(r=>r.kind==='loan'&&left(r)>0),res=records.filter(r=>r.kind==='reservation');
 $('#today').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});
 document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.tab===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');b.innerHTML=icon(b.dataset.tab)+b.dataset.tab});
 const checkout=action('Check out','loan',true,'plus'),reserve=action('Reserve','reservation',false,'Reservations'),print=action('Print sheet','print',false,'print');
 let html='';
 if(tab==='Inventory'){
 html=head('Cupboard inventory','4 inventory entries · 6 items in total',reserve+checkout)+'<div class="cards">'+items.map(it=>{
 const free=availability(records,it,date(),date()).free;
 return '<article class="card"><div class="art" style="background:'+it.bg+'">'+art(it.kind)+'</div><div class="details"><div class="type">'+(it.cap===1?'Tagged · '+it.id:'Pooled · Qty 3')+'</div><h3>'+it.name+'</h3>'+pill(it.cap===1?(free?'Available':'Unavailable'):free+' of 3 available',!free)+'</div></article>'}).join('')+'</div><section class="panel"><div class="panelhead"><h2>Current loans</h2>'+print+'</div>'+entries(loans,true)+'</section>';
 }else if(tab==='Loans')html=head('Current loans',loans.length+' open · '+loans.filter(r=>r.end<date()).length+' overdue',print+checkout)+entries(loans,true);
 else if(tab==='Reservations')html=head('Reservations','Check out a reservation during its reserved dates.',reserve)+entries(res,false);
 else{
 html=head('Date-range availability','Check the quantity available throughout both dates.',reserve)+'<div class="range"><label>Start date<input type="date" id="rangeStart" value="'+rangeStart+'"></label><label>End date<input type="date" id="rangeEnd" value="'+rangeEnd+'"></label></div>';
 if(!rangeStart||!rangeEnd||rangeEnd<rangeStart)html+='<p class="error">Choose an end date on or after the start date.</p>';
 else html+=items.map(it=>{const a=availability(records,it,rangeStart,rangeEnd);return '<article class="entry"><div><strong>'+it.name+'</strong> '+(it.cap===1?it.id:'(pool of 3)')+(a.blockers.length?'<div class="meta">'+esc(why(a))+'</div>':'')+'</div>'+pill(a.free+' available',!a.free)+'</article>'}).join('');
 }
 $('#view').innerHTML=html;
 $('#printout').innerHTML='<h1>Shared cupboard · Current loans</h1><p>As of '+fmt(date())+'</p>'+(loans.length?'<table><thead><tr>'+['Household','Item','Tag','Still out','Checkout','Expected return','Status'].map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+loans.map(r=>'<tr>'+[r.house,item(r.item).name,item(r.item).cap===1?r.item:'—',left(r),fmt(r.start),fmt(r.end),r.end<date()?'Overdue':'Open'].map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>':'<p>No current loans.</p>');
}
function openForm(op,id){
 mode=op;target=id;const r=records.find(r=>r.id===id),reserve=op==='reservation',create=reserve||op==='loan';
 const title={loan:'Check out equipment',reservation:'Reserve equipment',return:'Record return',pickup:'Check out reservation',cancel:'Cancel reservation'}[op];
 let fields='';
 if(create){
 const start=reserve?(tab==='Availability'&&rangeStart>date()?rangeStart:offset(1)):date();
 const end=reserve?(tab==='Availability'&&rangeEnd>=start?rangeEnd:start):offset(7);
 fields='<label>Household label<input name="house" maxlength="32" placeholder="e.g. Apt 4B" required autofocus></label><label>Equipment<select name="item">'+items.map(i=>'<option value="'+i.id+'">'+i.name+' · '+(i.cap===1?i.id:'pool of 3')+'</option>').join('')+'</select></label><label id="qtyLabel" hidden>Quantity<input type="number" name="qty" value="1" min="1" max="3" required></label><div class="fields"><label>'+(reserve?'Start date':'Checkout date')+'<input type="date" name="start" value="'+start+'" '+(reserve?'min="'+offset(1)+'"':'max="'+date()+'"')+' required></label><label>'+(reserve?'End date':'Expected return')+'<input type="date" name="end" value="'+end+'" min="'+start+'" required></label></div>';
 }else{
 if(!r)return;
 fields='<p>'+esc(r.house)+' · '+item(r.item).name+' · '+(item(r.item).cap===1?r.item:left(r)+' cords')+'</p>';
 if(op==='return')fields+='<label>Quantity returned<input name="qty" type="number" value="'+left(r)+'" min="1" max="'+left(r)+'" required></label>';
 if(op==='pickup')fields+='<p>Check out today with an expected return of '+fmt(r.end)+'.</p>';
 }
 $('#form').innerHTML='<h2 id="dialogTitle">'+title+'</h2>'+fields+'<div class="error" role="alert" id="error"></div><div class="actions"><button type="button" data-op="close">Back</button><button class="primary">'+({loan:'Save loan',reservation:'Save reservation',return:'Save return',pickup:'Check out',cancel:'Cancel reservation'}[op])+'</button></div>';
 $('#dialog').setAttribute('aria-labelledby','dialogTitle');$('#dialog').showModal();
}
$('#form').oninput=e=>{const f=e.currentTarget.elements;$('#error').textContent='';
 if(e.target.name==='item'){$('#qtyLabel').hidden=item(f.namedItem('item').value).cap===1;f.qty.value=1}
 if(e.target.name==='start')f.end.min=f.start.value;
};
$('#form').onsubmit=async e=>{
 e.preventDefault();const f=new FormData(e.currentTarget),op=mode,id=target,submit=e.submitter;if(submit)submit.disabled=true;
 try{await commit((all,store)=>{
 const r=all.find(x=>x.id===id),today=date();
 if(op==='return'){
 const qty=Number(f.get('qty'));if(!r||r.kind!=='loan'||!Number.isInteger(qty)||qty<1||qty>left(r))throw Error('The remaining quantity has changed. Reopen this loan.');
 r.returns.push({qty,day:today});store.put(r);return;
 }
 if(op==='cancel'){if(!r||r.kind!=='reservation')throw Error('This reservation has changed.');store.delete(id);return}
 const pickup=op==='pickup';
 if(pickup&&(!r||r.kind!=='reservation'||today<r.start||today>r.end))throw Error('This reservation is unavailable for pickup.');
 const data=pickup?{...r,start:today,kind:'loan'}:{id:crypto.randomUUID(),house:f.get('house').trim(),kind:op,item:f.get('item'),qty:Number(f.get('qty')),start:f.get('start'),end:f.get('end'),returns:[]};
 const it=item(data.item);
 if(!data.house||!it||!Number.isInteger(data.qty)||data.qty<1||data.qty>it.cap||!data.start||!data.end||data.end<data.start)throw Error('Enter a household label, valid quantity and ordered dates.');
 if(op==='reservation'&&data.start<=today)throw Error('Choose a future reservation start date.');
 if(op==='loan'&&data.start>today)throw Error('Choose today or an earlier checkout date.');
 const a=availability(all,it,data.start,data.end<today?'9999-12-31':data.end,pickup?id:null);
 if(data.qty>a.free)throw Error('Only '+a.free+' available. '+why(a));
 store.put(data);
 });$('#dialog').close();notice(({loan:'Loan saved.',reservation:'Reservation saved.',return:'Return recorded.',pickup:'Reservation checked out.',cancel:'Reservation canceled.'})[op]);
 }catch(err){$('#error').textContent=err.message}finally{if(submit)submit.disabled=false}
};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;notice('');render();return}
 const op=b.dataset.op;if(!op)return;if(op==='close')$('#dialog').close();else if(op==='print'){render();window.print()}else if(db)openForm(op,b.dataset.id);
});
$('#view').onchange=e=>{if(e.target.id==='rangeStart'||e.target.id==='rangeEnd'){rangeStart=$('#rangeStart').value;rangeEnd=$('#rangeEnd').value;render();$('#'+e.target.id).focus()}};
if(channel)channel.onmessage=refresh;
window.addEventListener('focus',refresh);
window.addEventListener('beforeprint',render);
let lastDay=date();setInterval(()=>{if(date()!==lastDay){lastDay=date();refresh()}},30000);
