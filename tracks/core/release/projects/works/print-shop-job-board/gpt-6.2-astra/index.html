<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Folio · Copy shop job board</title>
<style>
:root{--ink:#24382e;--paper:#fbfaf5;--line:#c9cfc3;--green:#284c3c;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Helvetica Neue",Arial,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #397aa1;outline-offset:3px}.wrap{max-width:1680px;margin:auto;padding:0 clamp(18px,3.3vw,56px)}header{border-bottom:1px solid var(--line)}header .wrap,.row,.tools,.brand,.meta,.stage-head,.card-foot{display:flex;align-items:center}.row,.stage-head,.card-foot{justify-content:space-between;gap:10px}header .wrap{min-height:69px;justify-content:space-between}.brand{gap:10px}.logo{width:32px;height:36px;position:relative}.logo:before,.logo:after{content:"";position:absolute;width:18px;height:24px;border:2px solid var(--green);transform:skewY(-14deg);top:3px;left:9px;background:var(--paper)}.logo:before{left:3px;top:9px;background:var(--green)}.wordmark{font:italic bold 32px/1 Georgia,serif;letter-spacing:-2px}.small,.meta,.eyebrow,.count,.id,.label,.day{font:11px/1.4 var(--mono);letter-spacing:.07em;text-transform:uppercase}.small{margin-left:7px;border-left:1px solid var(--line);padding-left:15px}.meta{gap:8px;letter-spacing:.035em;text-transform:none}.dot{width:7px;height:7px;border-radius:50%;background:#558766;display:inline-block}.intro{padding:38px 0 26px}.eyebrow{font-weight:bold;color:#597060}h1,h2,h3,p{margin:0}h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:normal;letter-spacing:-.045em}h1{font-size:clamp(44px,5vw,76px);line-height:1.12;margin:5px 0 10px}.stats{color:#526154}.tools{gap:8px;flex-wrap:wrap}.btn{background:transparent;border:1px solid #aab6a9;padding:9px 14px;border-radius:5px;font-size:13px;font-weight:600}.btn:hover,.job:hover{background:#f0f2e9}.primary{background:var(--green);color:white;border-color:var(--green)}.primary:hover{background:#376047}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.stage{background:#f0f1e9;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:320px}.stage-head{padding:13px 12px;background:var(--tint);border-bottom:1px solid var(--line);font-weight:650;font-size:14px}.stage-name{display:flex;align-items:center;gap:7px}.stage-name i{width:8px;height:8px;border-radius:50%;background:var(--accent)}.count{background:#ffffff65;border:1px solid #23332926;border-radius:4px;padding:0 5px}.cards{padding:9px}.empty{font:12px var(--mono);color:#687467;padding:24px 4px;text-align:center;border:1px dashed #c4ccbe;border-radius:5px}.job{display:block;text-align:left;background:#fffefa;border:1px solid #c4cbbf;width:100%;border-radius:5px;padding:11px;margin-bottom:8px;box-shadow:0 2px 1px #26392d09}.art{height:69px;position:relative;overflow:hidden;display:flex;align-items:center;padding:10px 13px;margin-bottom:13px;background:#dbe3d5;color:#345342}.art span{z-index:1;position:relative;font:italic bold clamp(22px,2.2vw,38px)/1 Georgia,serif;letter-spacing:-.07em}.art:after{content:"";position:absolute;right:-29px;top:-48px;width:118px;height:154px;border-radius:50%;background:repeating-radial-gradient(ellipse at center,transparent 0 4px,currentColor 5px 6px);transform:rotate(30deg)}.recital{background:#e4d9ef;color:#574168}.museum{background:#f1cbb6;color:#834730}.museum:after{border-radius:0;background:repeating-linear-gradient(135deg,currentColor 0 4px,transparent 4px 11px);transform:rotate(10deg);right:-60px}.classbook{background:#d5e5ec;color:#37596c}.classbook:after{border-radius:0;background:repeating-linear-gradient(0deg,transparent 0 6px,currentColor 6px 8px);transform:rotate(-28deg);right:-62px}.id,.label{font-size:10px;color:#667367}.job h3{font-size:17px;line-height:1.22;letter-spacing:-.035em;margin:4px 0 13px}.due{font:12px/1.5 var(--mono)}.late{color:#a43026;font-weight:700}.card-foot{border-top:1px solid #dce0d6;margin-top:12px;padding-top:9px;font-size:12px}.arrow{font-size:16px}.queue{margin:34px 0 40px;border-top:2px solid var(--ink);padding-top:18px}.queue h2{font-size:35px}.day{color:#617062}.group{display:grid;grid-template-columns:minmax(145px,20%) 1fr;border-top:1px solid var(--line);padding:9px 0}.groups{margin-top:14px}.group h3{font-size:14px;padding:5px 0}.qrow{display:grid;grid-template-columns:minmax(0,1fr) 160px 130px;align-items:center;gap:12px;padding:5px 0;font-size:14px}.qrow button{background:none;border:none;text-align:left;padding:0;font-weight:550}.qrow button:hover{text-decoration:underline}.qty{text-align:right;font-family:var(--mono);font-size:12px}.dialog{border:1px solid var(--line);border-radius:10px;width:min(440px,94vw);max-height:90vh;padding:24px;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#192e2480}.dialog h2{font-size:31px}.close{background:none;border:none;font-size:25px}.field{display:grid;gap:5px;font-size:13px;font-weight:600;margin:13px 0}input,select{background:white;border:1px solid #a9b5a9;border-radius:4px;padding:9px;min-width:0;width:100%}.pickup{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.msg{color:#97362b}#notice{background:#f7dfb9;padding:10px}button:disabled{opacity:.5;cursor:default}[hidden]{display:none!important}
@media(max-width:1000px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.stage{min-height:140px}}@media(max-width:650px){.intro.row{align-items:flex-start;flex-direction:column}.board{grid-template-columns:1fr 1fr;gap:8px}.stage-head{padding:11px 8px}.cards{padding:6px}.group{display:block}.qrow{grid-template-columns:1fr auto}.qrow .due{grid-column:1;grid-row:2}.qty{grid-column:2;grid-row:1/3}.meta{font-size:10px}.art span{font-size:24px}.queue>.row{align-items:flex-start;flex-direction:column}}@media print{@page{margin:15mm}body{background:white;color:black}header .meta,.intro,.board,.tools,dialog,#notice{display:none!important}.wrap{max-width:none;padding:0}header .wrap{min-height:45px}.queue{border:0;margin:18px 0}.group{display:block}.group h3{break-after:avoid}.qrow{display:grid;grid-template-columns:1fr 180px 120px;break-inside:avoid}.qrow .due,.qty{grid-column:auto;grid-row:auto}.queue>.row{flex-direction:row}.groups{margin-top:16px}}
</style></head><body><header><div class="wrap"><div class="brand"><i class="logo" aria-hidden="true"></i><b class="wordmark">Folio</b><span class="small">Copy shop</span></div><span class="meta"><i class="dot"></i> Offline workspace</span></div></header><div id="notice" hidden role="alert"></div><main class="wrap"><section class="intro row"><div><div class="eyebrow" id="today"></div><h1>Job board</h1><p class="stats" id="stats"></p></div><div class="tools"><button class="btn" id="print">Print daily queue</button><button class="btn primary" id="add">＋ New job</button></div></section><section class="board" id="board" aria-label="Production stages"></section><section class="queue"><div class="row"><h2>Daily queue</h2><span class="day" id="queueDate"></span></div><div class="groups" id="groups"></div></section></main>
<dialog class="dialog" id="editor"><form id="form"><div class="row"><h2 id="heading"></h2><button type="button" class="close" aria-label="Close" id="close">×</button></div><label class="field">Job name<input id="name" required maxlength="100"></label><label class="field">Total copies<input id="copies" type="number" min="1" max="999999" required></label><label class="field">Due date and time<input type="datetime-local" id="due" required></label><label class="field">Stage<select id="stage"></select></label><div class="pickup" id="pickup"><p id="balance"></p><label class="field" id="pickupField">Copies collected this pickup<input id="collected" type="number" min="0" placeholder="0"></label></div><p class="msg" role="alert" id="error"></p><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" type="submit">Save job</button></div></form></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id), stages=['Intake','Proofing','Ready to Print','Printing','Pickup'], actions=['Review intake','Check proofs','Start printing','Finish printing','Hand over copies'],tints=['#e3e7de','#e9e0f0','#f1e6c9','#dbe6ed','#dceadb'],accents=['#798674','#8e739f','#ab893b','#7393a7','#658c68'];
const key='folio-board-v1', pad=n=>String(n).padStart(2,'0'), local=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
function seed(now=new Date()){const tue=new Date(now);tue.setDate(tue.getDate()+(2-tue.getDay()+7)%7);return [['Recital program',75,1,0,15,'recital'],['Museum flyer',200,2,1,10,'museum'],['Class booklet',30,4,0,12,'classbook']].map(([name,copies,stage,offset,hour,art],i)=>{let d=new Date(tue);d.setDate(d.getDate()+offset);d.setHours(hour,0,0,0);return {id:i+1,name,copies,stage,due:local(d),art,picked:0}})}
let jobs=[],editing=null,baseline='',storageOK=true;
function load(){try{const data=localStorage.getItem(key);jobs=data===null?seed():JSON.parse(data);if(!Array.isArray(jobs))throw Error();if(data===null)localStorage.setItem(key,JSON.stringify(jobs));}catch{storageOK=false;$('notice').hidden=false;$('notice').textContent='Saved jobs could not be accessed. Enable browser storage and reopen the board before making changes.'}}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), left=j=>j.copies-j.picked;
function dateLabel(d){return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}
function dueLabel(j){const d=new Date(j.due),late=left(j)>0&&d<new Date();return '<span class="due '+(late?'late':'')+'">'+(late?'Overdue · ':'')+dateLabel(d)+' · '+j.due.slice(-5)+'</span>'}
function card(j){const art={recital:'Recital',museum:'Museum',classbook:'Class notes'}[j.art];return '<button class="job" data-id="'+j.id+'">'+(art?'<div class="art '+j.art+'" aria-hidden="true"><span>'+art+'</span></div>':'')+'<span class="id">JOB '+String(j.id).padStart(3,'0')+'</span><h3>'+esc(j.name)+'</h3>'+dueLabel(j)+'<div class="card-foot"><span>'+left(j)+' of '+j.copies+' outstanding</span><span class="arrow">↗</span></div></button>'}
function render(){const now=new Date(),active=jobs.filter(j=>left(j)>0).sort((a,b)=>a.due.localeCompare(b.due)||a.id-b.id);$('today').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});$('queueDate').textContent=dateLabel(now)+', '+now.getFullYear();$('stats').textContent=active.length+' active job'+(active.length===1?'':'s')+' · '+active.reduce((n,j)=>n+left(j),0)+' copies outstanding';$('board').innerHTML=stages.map((s,i)=>{const list=active.filter(j=>j.stage===i);return '<section class="stage" style="--tint:'+tints[i]+';--accent:'+accents[i]+'"><div class="stage-head"><span class="stage-name"><i></i>'+s+'</span><span class="count">'+list.length+'</span></div><div class="cards">'+(list.map(card).join('')||'<div class="empty">No jobs here</div>')+'</div></section>'}).join('');$('groups').innerHTML=actions.map((a,i)=>{const list=active.filter(j=>j.stage===i);return list.length?'<section class="group"><h3>'+a+'</h3><div>'+list.map(j=>'<div class="qrow"><button data-id="'+j.id+'">'+esc(j.name)+'</button>'+dueLabel(j)+'<span class="qty">'+left(j)+' remaining</span></div>').join('')+'</div></section>':''}).join('')||'<p>No outstanding jobs.</p>'}
$('stage').innerHTML=stages.map((s,i)=>'<option value="'+i+'">'+s+'</option>').join('');
function pickup(){const picked=editing?.picked||0,remaining=Number($('copies').value)-picked;$('balance').textContent=picked+' collected · '+Math.max(0,remaining)+' outstanding';$('pickupField').hidden=$('stage').value!=='4';$('collected').disabled=$('pickupField').hidden;$('collected').max=remaining;if($('collected').disabled)$('collected').value=''}
function openJob(id){editing=jobs.find(j=>j.id===id);baseline=JSON.stringify(editing);$('heading').textContent=editing?'Edit job':'New job';$('name').value=editing?.name||'';$('copies').value=editing?.copies||'';$('copies').min=Math.max(1,editing?.picked||0);$('due').value=editing?.due||'';$('stage').value=editing?.stage||0;$('collected').value='';$('error').textContent='';$('pickup').hidden=!editing&&$('stage').value!=='4';pickup();$('editor').showModal()}
$('stage').onchange=()=>{$('pickup').hidden=!editing&&$('stage').value!=='4';pickup()};$('copies').oninput=pickup;
$('form').onsubmit=e=>{e.preventDefault();if(!storageOK)return $('error').textContent='Browser storage is unavailable.';const name=$('name').value.trim();if(!name)return $('error').textContent='Enter a job name.';try{const current=JSON.parse(localStorage.getItem(key));if(editing&&JSON.stringify(current.find(j=>j.id===editing.id))!==baseline)return $('error').textContent='This job changed in another tab. Close and reopen it to use the latest details.';const job={...editing,id:editing?.id??current.reduce((n,j)=>Math.max(n,j.id),0)+1,name,copies:Number($('copies').value),due:$('due').value,stage:Number($('stage').value),picked:(editing?.picked||0)+Number($('collected').value)};const next=editing?current.map(j=>j.id===job.id?job:j):[...current,job];localStorage.setItem(key,JSON.stringify(next));jobs=next;render();$('editor').close()}catch{$('error').textContent='Could not save this job. Check browser storage and try again.'}};
document.onclick=e=>{const btn=e.target.closest('[data-id]');if(btn)openJob(Number(btn.dataset.id))};$('add').onclick=()=>openJob(null);$('close').onclick=$('cancel').onclick=()=>$('editor').close();$('print').onclick=()=>{render();window.print()};load();render();window.addEventListener('storage',e=>{if(e.key===key){load();render()}});setInterval(render,60000);
</script></body></html>
