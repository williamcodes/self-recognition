<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 612 792"><text x="38" y="48" font-family="Arial" font-size="11" font-weight="bold" fill="#355b43" letter-spacing="1.4">COURTYARD SEED SWAP</text><text x="574" y="48" font-family="Arial" font-size="11" font-weight="bold" fill="#586159" text-anchor="end" letter-spacing="1">HOST COPY</text><path d="M38 62 L574 62" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M38 740 L574 740" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="38" y="761" font-family="Arial" font-size="12" font-weight="bold" fill="#355b43" >Print single-sided   /   US Letter   /   Actual size (100%)</text><text x="38" y="132" font-family="Georgia" font-size="50" font-weight="bold" fill="#202d27" >Set up the swap</text><text x="39" y="167" font-family="Arial" font-size="18" font-weight="normal" fill="#202d27" >One entrance sign, three seed tables, one envelope station.</text><path d="M38 204 L574 204" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="38" y="233" font-family="Georgia" font-size="23" font-weight="bold" fill="#202d27" >Before residents arrive</text><text x="38" y="259" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >Tape the welcome sheet at the courtyard entrance. Face each</text><text x="38" y="280" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >table sign toward arriving visitors, where children can see it.</text><text x="38" y="301" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >Set basil under Herbs, calendula under Flowers, and snap pea</text><text x="38" y="322" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >under Vegetables. Write the plant name on every starter packet.</text><path d="M38 357 L574 357" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="38" y="386" font-family="Georgia" font-size="23" font-weight="bold" fill="#202d27" >Prepare the shared station</text><text x="38" y="412" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >Post the envelope sign above a clear writing surface. Set out</text><text x="38" y="433" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >blank envelopes, markers, and short strips of masking tape.</text><text x="38" y="454" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >Leave room for two neighbors to write side by side. Keep the</text><text x="38" y="475" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >path between the station and the seed tables open.</text><path d="M38 513 L574 513" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="38" y="542" font-family="Georgia" font-size="23" font-weight="bold" fill="#202d27" >Open the swap</text><text x="38" y="568" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >“Welcome! Take one packet to start, even if you didn’t bring</text><text x="38" y="589" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >seeds. If you brought some to share, we’ll help you label them.”</text><text x="38" y="610" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >Invite children to match the plant names or carry a closed packet.</text><path d="M38 646 L574 646" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="38" y="675" font-family="Georgia" font-size="23" font-weight="bold" fill="#202d27" >During the swap</text><text x="38" y="701" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >Refill envelopes and spread packets so names stay visible.</text><text x="38" y="722" font-family="Arial" font-size="16.5" font-weight="normal" fill="#202d27" >Keep unidentified seeds with their owner until identified.</text></svg>