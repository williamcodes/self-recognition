<svg xmlns="http://www.w3.org/2000/svg" width="8.5in" height="11in" viewBox="0 0 612 792"><text x="38" y="48" font-family="Arial" font-size="11" font-weight="bold" fill="#355b43" letter-spacing="1.4">COURTYARD SEED SWAP</text><text x="574" y="48" font-family="Arial" font-size="11" font-weight="bold" fill="#586159" text-anchor="end" letter-spacing="1">SHARED STATION</text><path d="M38 62 L574 62" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M38 740 L574 740" stroke="#202d27" stroke-width="1" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="38" y="761" font-family="Arial" font-size="12" font-weight="bold" fill="#355b43" >If you’re unsure what a seed is, ask a host before sharing it.</text><text x="38" y="132" font-family="Georgia" font-size="54" font-weight="bold" fill="#202d27" >Envelope station</text><text x="39" y="168" font-family="Arial" font-size="21" font-weight="normal" fill="#202d27" >Bring loose garden seeds here.</text><circle cx="54" cy="219" r="15" fill="white" stroke="#355b43" stroke-width="1.5"/><text x="54" y="224" font-family="Arial" font-size="14" font-weight="bold" fill="#355b43" text-anchor="middle">1</text><text x="83" y="226" font-family="Georgia" font-size="23" font-weight="bold" fill="#202d27" >Write on an empty envelope.</text><text x="83" y="253" font-family="Arial" font-size="17" font-weight="normal" fill="#202d27" >Print the plant name. Add the variety and harvest year</text><text x="83" y="276" font-family="Arial" font-size="17" font-weight="normal" fill="#202d27" >if you know them. A host can help you write.</text><path d="M116 328 H495 V466 H116Z" stroke="#355b43" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M116 328 l20 16 h339 l20 -16" stroke="#355b43" stroke-width="1.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="142" y="373" font-family="Arial" font-size="11" font-weight="bold" fill="#355b43" letter-spacing="1.4">EXAMPLE PACKET</text><text x="141" y="427" font-family="Georgia" font-size="39" font-weight="bold" fill="#202d27" >Snap pea</text><circle cx="54" cy="526" r="15" fill="white" stroke="#355b43" stroke-width="1.5"/><text x="54" y="531" font-family="Arial" font-size="14" font-weight="bold" fill="#355b43" text-anchor="middle">2</text><text x="83" y="533" font-family="Georgia" font-size="23" font-weight="bold" fill="#202d27" >Fill it and fold it shut.</text><text x="83" y="560" font-family="Arial" font-size="17" font-weight="normal" fill="#202d27" >Use one kind of seed per envelope. Add enough for</text><text x="83" y="583" font-family="Arial" font-size="17" font-weight="normal" fill="#202d27" >a neighbor to try. Seal the flap with masking tape.</text><circle cx="54" cy="639" r="15" fill="white" stroke="#355b43" stroke-width="1.5"/><text x="54" y="644" font-family="Arial" font-size="14" font-weight="bold" fill="#355b43" text-anchor="middle">3</text><text x="83" y="646" font-family="Georgia" font-size="23" font-weight="bold" fill="#202d27" >Set it out to share.</text><text x="83" y="673" font-family="Arial" font-size="17" font-weight="normal" fill="#202d27" >Carry the packet to Herbs, Flowers, or Vegetables.</text><text x="83" y="696" font-family="Arial" font-size="17" font-weight="normal" fill="#202d27" >The snap pea packet goes to Vegetables.</text></svg>