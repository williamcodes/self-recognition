<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#264d40"><title>Mending Table · Repair desk</title><link rel="stylesheet" href="desk.css"><script defer src="desk.js"></script></head>
<body><header><div class="bar"><div class="brand"><span class="patch" aria-hidden="true">✳</span>Mending Table</div><span class="location">Repair café</span><span class="offline"><i></i> Offline desk</span></div></header>
<main><section class="hero"><div><div class="date" id="date"></div><h1>Repair desk</h1><p>Check in garments and follow each repair from tag to pickup.</p></div><img src="machine.svg" alt="" width="235" height="136"></section>
<div id="error" role="alert" hidden></div><div id="notice" role="status"></div>
<div class="workspace"><section class="card intake"><div class="section-head"><span class="tile"><svg viewBox="0 0 24 24"><path d="M3 4h9l9 9-8 8-10-10z"/><circle cx="8" cy="8.5" r="1.4"/></svg></span><h2>New intake</h2></div><p class="sub">Add up to 3 items for one visitor.</p>
<form id="intake"><div id="fields"></div><button type="button" id="more" class="add">＋ Add another item</button><button id="save" class="primary" disabled>Save intake <span aria-hidden="true">→</span></button><p class="hint">Use garment details only. Leave out personal details.</p></form></section>
<section class="card queue"><div class="section-head"><span class="tile"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 3h10v10H3z"/><path d="M5 7V4h13v6"/></svg></span><h2>Repair queue</h2><span id="total" class="total">0 items</span></div><div class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 6 6"/></svg><input id="search" type="search" aria-label="Search tickets, garments or requests" placeholder="Search ticket, garment or request"></div>
<div id="filters" role="group" aria-label="Filter by repair status"></div><div class="records" id="records"></div></section></div>
</main><template id="item"><fieldset><legend>Item 1</legend><button class="remove" type="button">Remove</button><label>Garment<input class="garment" maxlength="80" required placeholder="e.g. Blue jeans" autocomplete="off"></label><label>Repair request<select class="request" required><option value="">Select a repair</option><option>Hemming</option><option>Patching</option><option>Button replacement</option><option>Seam repair</option><option>Zip repair</option><option>Other repair</option></select></label><label class="detail" hidden>Describe the repair<input maxlength="100" placeholder="e.g. Mend a torn pocket"></label></fieldset></template>
<noscript>Enable JavaScript to use the repair desk.</noscript></body></html>
