</style><main><aside><h1>Set your table</h1><p>Add your venue and a way to reserve a seat. Save a PNG to share, or print the finished invitation. Choose “Save as PDF” in the print dialog for a digital flyer.</p><label>Café name<input maxlength="55"></label><label>Street address and town<input maxlength="75"></label><label>RSVP contact or instructions<input maxlength="70"></label><button onclick="window.print()">Print invitation</button><button id="save">Save PNG</button><p aria-live="polite" id="status"></p></aside><article><svg xmlns="http://www.w3.org/2000/svg" width="612" height="792" viewBox="0 0 612 792"><rect x="0" y="0" width="612" height="792" fill="white"/><text x="42" y="51" font-family="Arial" font-size="9" font-weight="bold" fill="#973f29" letter-spacing="1.6">A MONTHLY BOOK CLUB</text><text x="570" y="51" font-family="Arial" font-size="10" font-weight="normal" fill="#555e58" text-anchor="end">KICKOFF   /   MARCH 2027</text><line x1="42" y1="62" x2="570" y2="62" stroke="#252c2a" stroke-width="1.4" /><text x="40" y="153" font-family="Georgia" font-size="83" font-weight="normal" fill="#252c2a" >Margin</text><text x="40" y="231" font-family="Georgia" font-size="83" font-weight="normal" fill="#252c2a" >Table</text><g transform="translate(359 84) scale(1.31)" stroke="#345954" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round" fill="white">

 <path d="M42 69 Q46 84 55 88" fill="none"/></g><text x="43" y="274" font-family="Georgia" font-size="22" font-weight="normal" fill="#345954" font-style="italic">A different independent café each month.</text><line x1="42" y1="299" x2="570" y2="299" stroke="#252c2a" stroke-width="1" /><text x="43" y="326" font-family="Arial" font-size="9" font-weight="bold" fill="#973f29" letter-spacing="1.6">THE FIRST MEETING</text><text x="42" y="367" font-family="Georgia" font-size="37" font-weight="normal" fill="#252c2a" >Wednesday, March 10</text><text x="44" y="396" font-family="Arial" font-size="22" font-weight="bold" fill="#252c2a" >6:30–7:30 p.m.   /   16 seats</text><line x1="42" y1="416" x2="570" y2="416" stroke="#252c2a" stroke-width="1" /><text x="43" y="444" font-family="Arial" font-size="9" font-weight="bold" fill="#973f29" letter-spacing="1.6">BRING A PASSAGE</text><text x="43" y="472" font-family="Arial" font-size="16.5" font-weight="normal" fill="#252c2a" >Choose any book and bring a few lines you could read in</text><text x="43" y="494" font-family="Arial" font-size="16.5" font-weight="normal" fill="#252c2a" >a minute. Bring the book, a copy, or the passage on your phone.</text><text x="43" y="535" font-family="Arial" font-size="9" font-weight="bold" fill="#973f29" letter-spacing="1.6">TAKE PART YOUR WAY</text><text x="43" y="562" font-family="Arial" font-size="17" font-weight="normal" fill="#252c2a" >First book club? Come listen. You can read aloud, ask</text><text x="43" y="584" font-family="Arial" font-size="17" font-weight="normal" fill="#252c2a" >someone to read for you, or pass and enjoy the stories.</text><rect x="42" y="610" width="528" height="110" fill="#f4efe5"/><text x="54" y="635" font-family="Arial" font-size="8.5" font-weight="bold" fill="#973f29" letter-spacing="1.6">CAFÉ</text><text x="135" y="635" font-family="Arial" font-size="14" font-weight="normal" fill="#252c2a"  id="field0"></text><line x1="135" y1="638" x2="554" y2="638" stroke="#555e58" s function update(){
  for(var i=0;i<inputs.length;i++){
    var field=document.getElementById('field'+i), size=14;
    field.textContent=inputs[i].value.trim();
    field.setAttribute('font-size',size);
    while(field.getComputedTextLength()>417 && size>8){
      size-=0.25;
      field.setAttribute('font-size',size);
    }
    art.querySelectorAll('.blank')[i].style.display=field.textContent?'none':'';
  }
}
for(var i=0;i<inputs.length;i++){ inputs[i].addEventListener('input',update); }
update();
document.getElementById('save').onclick=function(){
  var im=new Image();

    var ctx=canvas.getContext('2d');
    ctx.scale(2,2);
    for(var i=0;i<inputs.length;i++){
      var value=inputs[i].value.trim();
      if(!value) continue;
      var y=635+i*33, size=14;
      ctx.fillStyle='#f4efe5';
      ctx.fillRect(133,y-20,425,29);
      ctx.font=size+'px Arial';
      while(ctx.measureText(value).width>417 && size>8){
        size-=0.25;
        ctx.font=size+'px Arial';
      }
      ctx.fillStyle='#252c2a';
      ctx.fillText(value,135,y,417);
    }
    var link=document.createElement('a');
    link.href=canvas.toDataURL('image/png');
    link.download='Margin-Table-invitation.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
