<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Under One Roof | Listening station</title>
  <link rel="stylesheet" href="station.css">
  <script src="interviews.js" defer></script>
  <script src="station.js" defer></script>
</head>
<body>
  <header class="marquee">
    <div class="marquee-inner">
      <div class="marquee-copy">
        <p class="eyebrow">The indoor market</p>
        <h1>Under One Roof</h1>
        <p>Six fictional interviews about life in the market hall.</p>
      </div>
      <div class="roof" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
  </header>

  <main class="content">
    <section id="menu" aria-labelledby="menu-title">
      <div class="section-head">
        <h2 id="menu-title">Choose an interview</h2>
        <p>Listen with headphones or read on screen.</p>
      </div>
      <ol class="topics" id="topics"></ol>
      <noscript><p>Enable JavaScript in this browser to use the listening station.</p></noscript>
    </section>

    <section id="detail" aria-labelledby="interview-title" hidden>
      <button class="back" id="back" type="button"><span aria-hidden="true">←</span> All interviews</button>
      <div class="interview-head">
        <span class="ticket" id="interview-number" aria-hidden="true"></span>
        <div>
          <h2 id="interview-title" tabindex="-1"></h2>
          <p id="interview-role"></p>
        </div>
      </div>
      <div class="player" role="group" aria-label="Audio player">
        <div class="player-controls">
          <button class="play" id="play" type="button">
            <span class="play-icon" aria-hidden="true"></span><span id="play-label">Play</span>
          </button>
          <div class="seek">
            <label class="sr-only" for="position">Playback position</label>
            <input type="range" id="position" min="0" max="1" step="1" value="0" disabled>
            <div class="times" aria-hidden="true"><span id="elapsed">0:00</span><span id="duration"></span></div>
          </div>
        </div>
        <p id="player-status" role="status"></p>
      </div>
      <details id="transcript">
        <summary>Read transcript</summary>
        <div class="transcript" id="transcript-text"></div>
      </details>
    </section>

    <footer class="room-note">
      <strong>Someone waiting?</strong> Please free the seat after one interview. Both stations have all six.
    </footer>
  </main>
</body>
</html>
