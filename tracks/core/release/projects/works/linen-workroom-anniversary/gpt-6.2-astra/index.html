function write(i=-1){show('Memory book','<h2 id="heading">Leave a memory</h2><form id="form"><label for="topic">Choose a milestone</label><select id="topic"><option value="-1">Any time in the workroom</option>'+data.map((m,n)=>'<option value="'+n+'">'+m.year+' · '+m.title+'</option>').join('')+'</select><label for="note">Your memory</label><p class="hint" id="prompt"></p><textarea id="note" maxlength="500" required aria-describedby="prompt privacy"></textarea><p class="hint" id="privacy">A sentence is plenty. Skip names and personal details. Saved memories can be read by everyone using this tablet.</p><p class="error" role="alert" id="err"></p><button class="primary">Save to memory book</button></form>');const topic=el('topic');topic.value=i;topic.onchange=()=>el('prompt').textContent=data[topic.value]?.prompt||'What’s one workroom moment you’d like to keep?';topic.onchange();el('form').onsubmit=e=>{e.preventDefault();const note=el('note').value.trim();if(!note){el('err').textContent='Add a few words before saving.';el('note').focus();return}try{localStorage.setItem(prefix+Date.now()+'-'+Math.random(),JSON.stringify({topic:data[topic.value]?.year||'Workroom memory',note}))}catch{el('err').textContent='This browser could not save the memory. Please ask the lunch host for a paper slip.';return}show('Memory book','<h2 id="heading">Your memory is saved.</h2><p>Thank you for adding a piece of workroom life.</p><button id="done" class="primary">Back to the milestones</button>');el('done').onclick=()=>panel.close()}}
