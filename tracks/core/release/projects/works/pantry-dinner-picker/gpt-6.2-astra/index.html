<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantry Table · Dinner picker</title><style>
:root{color-scheme:light;--ink:#263d32;--muted:#5d695e;--line:#d9dcd0;--paper:#faf9f3;--green:#304e3c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "DM Sans",Arial,sans-serif}header{background:#253f32;color:#fffdf2}.bar,main{max-width:1320px;margin:auto;padding:0 clamp(20px,4.3vw,68px)}.bar{display:flex;align-items:center;justify-content:space-between;height:68px}.brand,h1,h2,h3{font-family:"Baskervville",Georgia,serif;font-weight:normal}.brand{font-size:25px;display:flex;gap:12px;align-items:center}.mark{font-size:31px;line-height:1;transform:rotate(-24deg);color:#e3dba5}.offline{font-size:12px;display:flex;align-items:center;gap:8px;color:#e3eadc}.offline i{width:7px;height:7px;background:#acbf91;border-radius:100%}.intro{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:36px 0 30px;gap:12px}.intro canvas{width:32%;max-width:338px;height:auto}.eyebrow{font-size:10px;letter-spacing:2px;font-weight:750;color:#637258}h1{font-size:clamp(40px,5vw,70px);letter-spacing:-.055em;line-height:1.05;margin:10px 0}.intro p{margin:0;color:var(--muted);font-size:16px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(235px,26%);gap:28px;padding:32px 0 50px}.sectionhead,.dialoghead,.row,.actions,.controls,.stepper{display:flex;align-items:center;justify-content:space-between}.sectionhead{margin-bottom:18px}h2{font-size:32px;line-height:1.2;letter-spacing:-1.4px;margin:0}h3{font-size:31px;margin:5px 0 12px;line-height:1.15;letter-spacing:-1.4px}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a36b29;outline-offset:3px}button:disabled{opacity:.5;cursor:default}.outline,.primary{border-radius:7px;padding:9px 14px;font-size:13px;font-weight:600}.outline{background:transparent;color:var(--ink);border:1px solid #bcc5b5}.outline:hover{background:#e8ecdf}.primary{background:var(--green);color:white;border:1px solid var(--green)}.primary:hover:enabled{background:#203929}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card,aside{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fffef9}.food{display:block;width:100%;height:155px}.content{padding:20px}.status{display:inline-flex;align-items:center;gap:5px;color:#42603c;background:#edf2e4;padding:3px 9px;font-size:11px;font-weight:600;border-radius:20px;margin-bottom:5px}.missing{color:#934d24;background:#fff0dc}.ingredients{padding:0;margin:0 0 16px;list-style:none}.ingredients li,.row{display:flex;justify-content:space-between;gap:8px}.ingredients li{padding:3px 0;font-size:14px;color:#505c51}.ingredients li span:last-child,.qty{font-variant-numeric:tabular-nums}.ingredients small{color:#95421d;display:block}.controls{border-top:1px solid var(--line);padding:13px 0;font-size:13px}.stepper{border:1px solid var(--line);border-radius:6px;gap:5px}.stepper button,#close,.remove{background:transparent;border:0;color:var(--ink);font-size:18px;padding:3px 10px}.stepper output{min-width:18px;text-align:center}.full{width:100%}.cook{display:flex;justify-content:space-between;width:100%}aside{align-self:start;padding:23px;background:#f0f2e8}.pantryhead{border-bottom:1px solid #cdd4c4;padding-bottom:17px}.pantryhead h2{margin-top:5px}.row{padding:13px 0;border-bottom:1px solid var(--line);font-size:14px}.row .name{display:flex;align-items:center;gap:10px}.icon{width:33px;height:33px;background:#fcfbf4;border-radius:9px}.qty{font-weight:600;white-space:nowrap}aside button{margin-top:19px}.card{display:flex;flex-direction:column}.content{flex:1;display:flex;flex-direction:column;align-items:stretch}.status{align-self:start}.controls{margin-top:auto}dialog{width:min(520px,94vw);border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:24px;max-height:90vh}dialog::backdrop{background:#16271eda}.dialoghead{margin-bottom:20px}label{display:grid;gap:4px;font-size:13px;font-weight:bold;margin:10px 0}input,select{width:100%;min-width:0;padding:9px;border:1px solid #bbc2b5;border-radius:5px;background:white;color:var(--ink)}.fieldrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;align-items:end;gap:5px}.remove{align-self:center}.actions{justify-content:flex-end;gap:8px;margin-top:20px}#error{color:#994422}#notice:not(:empty){position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#243e30;color:white;padding:10px 18px;border-radius:7px;z-index:3}.card h3,.name,.ingredients li span{overflow-wrap:anywhere}@media(max-width:950px){.layout{gap:16px}.cards{gap:12px}.content,aside{padding:15px}}@media(max-width:760px){.layout{grid-template-columns:1fr}.intro canvas{width:29%}}@media(max-width:520px){.cards{grid-template-columns:1fr}.intro canvas{display:none}.intro{padding:28px 0}.layout{padding-top:23px}.food{height:160px}.content{padding:18px}.fieldrow{grid-template-columns:1.5fr 1fr 1fr auto}.fieldrow input,.fieldrow select{padding:6px}.bar{height:56px}}
</style></head>
<body><header><div class="bar"><span class="brand"><span class="mark">♧</span> Pantry Table</span><span class="offline"><i></i> Offline kitchen</span></div></header>
<main><section class="intro"><div><div class="eyebrow">THE DINNER PICKER</div><h1>What’s for dinner?</h1><p>Pick a meal from what’s already in your pantry.</p></div><canvas id="shelf" width="450" height="170" aria-hidden="true"></canvas></section>
<div class="layout"><section><div class="sectionhead"><h2>Recipe box</h2><button class="outline" id="addRecipe">＋ Add recipe</button></div><div class="cards" id="recipes"></div></section>
<aside><div class="pantryhead"><span class="eyebrow">ON HAND</span><h2>Your pantry</h2></div><div id="pantry"></div><button class="outline full" id="addPantry">＋ Add pantry entry</button></aside></div>
</main><dialog id="modal"><form id="form"><div class="dialoghead"><h2 id="title"></h2><button type="button" id="close" aria-label="Close">×</button></div><div id="fields"></div><p id="error" role="alert"></p><div class="actions"><button type="button" class="outline" id="cancel">Cancel</button><button class="primary" id="submit"></button></div></form></dialog><div role="status" id="notice"></div><script>
// Small, locally drawn pantry and meal illustrations.
function illustrator(canvas) {
  const c=canvas.getContext('2d'); let seed=71;
  const random=()=>((seed=seed*16807%2147483647)-1)/2147483646;
  function path(d,fill,stroke,width=2){const p=new Path2D(d);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}}
  function oval(x,y,rx,ry,color,angle=0){c.beginPath();c.ellipse(x,y,rx,ry,angle,0,Math.PI*2);c.fillStyle=color;c.fill()}
  function item(name){const ink='#596044';
    if(/carrot/i.test(name)){path('M15 15 Q21 10 23 18 Q20 26 8 34 Q9 25 15 15Z','#db8746',ink,1);path('M20 15 Q17 8 18 5 M21 15 Q23 5 27 4 M22 16 Q28 8 31 9',null,ink,2);path('M14 20 l4 2 M12 26 l3 1',null,'#a65f36',1)}
    else if(/onion/i.test(name)){path('M19 6 Q22 14 27 16 C39 30 23 37 14 31 Q3 26 12 17 Q18 12 19 6Z','#dbc08b',ink,1);path('M20 13 Q12 26 19 32 M21 14 Q29 25 23 32',null,'#9e815a',1)}
    else if(/egg/i.test(name)){oval(16,23,8,11,'#cb9967',-.3);oval(24,19,8,12,'#f0d4a6',.3);oval(22,17,2,4,'#fbefcf',.3)}
    else {for(let i=0;i<17;i++){let a=random()*6.28,r=Math.sqrt(random());oval(20+12*r*Math.cos(a),21+10*r*Math.sin(a),3.2,/rice/i.test(name)?1.5:2.3,/rice/i.test(name)?'#b9a37a':'#bb7e43',random()*3)}}
  }
  return {c,path,oval,random,item};
}
function drawMeal(canvas,kind){const {c,path,oval,random}=illustrator(canvas),egg=kind==='egg',custom=kind==='custom';
  const bg=egg?'#dce3cf':custom?'#e4dfce':'#efdcc5';c.fillStyle=bg;c.fillRect(0,0,800,320);
  for(let i=0;i<3600;i++)oval(random()*800,random()*320,random()*1.3+.3,.8,'#66513812');
  c.translate(400,154);c.scale(1.06,1.06);
  oval(8,87,162,13,'#56432b22');
  path('M-143 -18 C-134 44 -84 89 -20 93 Q88 108 139 -18Z',egg?'#658a76':'#b86943','#494d39',3);
  path('M-127 9 Q0 92 125 9 M-114 29 Q0 98 110 32',null,egg?'#b4c4a5':'#dfaa7b',3);
  oval(-1,-17,144,49,'#504f38');oval(-1,-18,140,45,'#f5e7c7');oval(-1,-17,131,38,egg?'#d5ad73':'#aa6842');
  for(let i=0;i<390;i++){let a=random()*6.28,r=Math.sqrt(random()),x=122*r*Math.cos(a),y=-18+35*r*Math.sin(a);
    const colors=egg?['#f1dbac','#ffebc4','#d5b988']:['#c88845','#e1a459','#b36f3e','#e5ad68'];
    oval(x,y,egg?5:4,egg?2:3,colors[i%colors.length],random()*2-1)}
  for(let i=0;i<15;i++){let a=random()*6.28,r=Math.sqrt(random());c.save();c.translate(106*r*Math.cos(a),-17+29*r*Math.sin(a));c.rotate(random()-.5);path('M-9 -6 l14 -3 6 8 -14 5Z',i%3===0?'#63814b':'#da833e','#9a6d3e',1);c.restore()}
  if(egg){path('M-50 -27 C-53 -47 -26 -62 -7 -54 C11 -60 18 -43 37 -44 C63 -44 74 -23 59 -12 C51 3 20 0 6 6 C-25 14 -51 1 -50 -27Z','#fff6d9','#c6ad77',2);oval(4,-27,25,18,'#dc9432');oval(2,-30,20,13,'#f4b647');oval(-5,-35,6,2,'#f9d576')}
  else{path('M-41 -24 Q-8 -32 29 -51',null,'#536542',3);for(let i=0;i<7;i++){oval(-31+i*8,-30-i*2.7,9,3.6,i%2?'#425b37':'#74864f',i%2?.5:-.9)}}
}
function drawShelf(){const {c,path,oval,random,item}=illustrator(document.querySelector('#shelf'));
  path('M20 148 Q210 151 432 147',null,'#c2c4a9',2);
  function jar(x,y,w,h,color){c.save();c.translate(x,y);path('M4 12 Q4 4 12 4 L'+(w-10)+' 4 Q'+w+' 6 '+w+' 16 L'+w+' '+(h-7)+' Q'+w+' '+h+' '+(w-8)+' '+h+' H10 Q3 '+h+' 3 '+(h-7)+'Z','#eeedda','#67795f',2);c.save();c.beginPath();c.rect(6,h*.38,w-9,h*.6);c.clip();for(let i=0;i<520;i++)oval(6+random()*(w-9),h*.38+random()*h*.63,3.5,1.7,i%4?color:'#c1a579',random()*2);c.restore();path('M1 0 h'+w+' v9 H1Z','#8d9876','#586950',2);c.restore()}
  jar(50,54,64,89,'#d2bb8c');jar(124,23,76,121,'#bc8759');jar(211,70,58,74,'#b5ac79');
  c.translate(285,72);c.scale(2.1,2.1);item('onion');c.translate(23,-1);c.rotate(.5);item('carrot')
}
drawShelf();
</script><script>
'use strict';
const $=s=>document.querySelector(s), key='pantry-table-v1';
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const clean=s=>s.trim().replace(/\s+/g,' '), ident=(n,u)=>clean(n).toLowerCase()+'|'+u;
function fraction(n,d){const gcd=(a,b)=>b?gcd(b,a%b):a;let g=gcd(n<0n?-n:n,d);return [n/g,d/g]}
function read(s){let [a,b]=String(s).split('/');if(b)return [BigInt(a),BigInt(b)];let [w,f='']=a.split('.');return fraction(BigInt(w+f),10n**BigInt(f.length))}
const pack=([n,d])=>d===1n?String(n):n+'/'+d;
function add(a,b,sign=1n){return fraction(a[0]*b[1]+sign*b[0]*a[1],a[1]*b[1])}
function display([n,d]){let t=d;while(t%2n===0n)t/=2n;while(t%5n===0n)t/=5n;if(t!==1n)return (n>=d?n/d+' ':'')+n%d+'/'+d;
 let s=String(n/d),r=n%d;if(r)s+='.';while(r){r*=10n;s+=r/d;r%=d}return s}
const line=(name,unit,q)=>({name,unit,q:String(q)});
const seed={pantry:[line('Rice','g',500),line('Lentils','g',300),line('Carrots','items',4),line('Eggs','items',6),line('Onions','items',2)],recipes:[
 {name:'Carrot lentils',kind:'lentils',base:2,serves:2,lines:[line('Lentils','g',150),line('Carrots','items',2),line('Onions','items',1)]},
 {name:'Egg rice',kind:'egg',base:2,serves:2,lines:[line('Rice','g',160),line('Eggs','items',2),line('Carrots','items',1)]}]};
let state, action, timer;
function load(){let value=localStorage.getItem(key);return value?JSON.parse(value):structuredClone(seed)}
function notify(msg){clearTimeout(timer);$('#notice').textContent=msg;timer=setTimeout(()=>$('#notice').textContent='',4500)}
function find(lines,l){return lines.find(p=>ident(p.name,p.unit)===ident(l.name,l.unit))}
function plan(r){return r.lines.map(l=>{let [n,d]=read(l.q);n*=BigInt(r.serves);d*=BigInt(r.base);let need=l.unit==='items'?[(n+d-1n)/d,1n]:fraction(n,d);let stock=find(state.pantry,l),left=add(read(stock?.q||0),need,-1n);return {...l,need,stock,left,short:left[0]<0n}})}
const amt=(f,u)=>display(f)+(u==='g'?' g':f[0]===f[1]?' item':' items');
function render(){
 $('#pantry').innerHTML=state.pantry.map((p,i)=>'<div class="row"><span class="name"><canvas class="icon" width="40" height="40" data-icon="'+i+'" aria-hidden="true"></canvas>'+esc(p.name)+'</span><span class="qty">'+amt(read(p.q),p.unit)+'</span></div>').join('');
 document.querySelectorAll('[data-icon]').forEach(el=>illustrator(el).item(state.pantry[el.dataset.icon].name));
 $('#recipes').innerHTML=state.recipes.map((r,i)=>{let lines=plan(r),short=lines.some(l=>l.short);return `<article class="card"><canvas class="food" width="800" height="320" data-art="${i}" aria-hidden="true"></canvas><div class="content"><span class="status ${short?'missing':''}">${short?'− Short on ingredients':'✓ Ready to cook'}</span><h3>${esc(r.name)}</h3><ul class="ingredients">${lines.map(l=>'<li><span>'+esc(l.name)+'</span><span>'+amt(l.need,l.unit)+(l.short?'<small>Need '+amt([-l.left[0],l.left[1]],l.unit)+' more</small>':'')+'</span></li>').join('')}</ul><div class="controls"><span>Servings</span><div class="stepper"><button data-i="${i}" data-step="-1" aria-label="Fewer servings of ${esc(r.name)}" ${r.serves===1?'disabled':''}>−</button><output>${r.serves}</output><button data-i="${i}" data-step="1" aria-label="More servings of ${esc(r.name)}" ${r.serves===9999?'disabled':''}>+</button></div></div><button class="primary cook" data-cook="${i}" ${short?'disabled':''}>Review meal <span>→</span></button></div></article>`}).join('');
 document.querySelectorAll('[data-art]').forEach(el=>drawMeal(el,state.recipes[el.dataset.art].kind))
}
async function change(fn){const save=()=>{state=load();fn();localStorage.setItem(key,JSON.stringify(state));render()};if(navigator.locks)await navigator.locks.request(key,save);else save()}
function modal(title,body,submit,fn){$('#title').textContent=title;$('#fields').innerHTML=body;$('#submit').textContent=submit;$('#error').textContent='';action=fn;$('#modal').showModal()}
const close=()=>$('#modal').close();$('#cancel').onclick=$('#close').onclick=close;
$('#form').onsubmit=async e=>{e.preventDefault();$('#submit').disabled=true;try{await action();close()}catch(err){$('#error').textContent=err.message}finally{$('#submit').disabled=false}};
function entry(removable){return `<div class="fieldrow"><label>Ingredient<input class="nm" list="names" required maxlength="80" placeholder="e.g. Rice"></label><label>Amount<input class="amount" required inputmode="decimal" placeholder="0"></label><label>Unit<select class="unit"><option value="g">g</option><option>items</option></select></label>${removable?'<button class="remove" type="button" aria-label="Remove ingredient">×</button>':''}</div>`}
function names(){return '<datalist id="names">'+state.pantry.map(p=>'<option value="'+esc(p.name)+'">').join('')+'</datalist>'}
function values(el){let name=clean(el.querySelector('.nm').value),q=el.querySelector('.amount').value.trim(),unit=el.querySelector('.unit').value;if(!name)throw Error('Enter an ingredient name.');if(!/^\d{1,12}(\.\d{1,6})?$/.test(q)||read(q)[0]<=0n)throw Error('Enter a positive amount with up to 12 whole digits and 6 decimal places.');if(unit==='items'&&read(q)[1]!==1n)throw Error('Enter a whole number of items.');return line(name,unit,pack(read(q)))}
function combine(lines,l){let old=find(lines,l);if(old)old.q=pack(add(read(old.q),read(l.q)));else lines.push(l)}
$('#addPantry').onclick=()=>modal('Add pantry entry',names()+entry(false),'Add to pantry',async()=>{let l=values($('.fieldrow'));await change(()=>combine(state.pantry,l));notify('Added '+amt(read(l.q),l.unit)+' of '+l.name+'.')});
$('#addRecipe').onclick=()=>{modal('Add recipe',names()+'<label>Recipe name<input required maxlength="80" id="recipeName"></label><label>Base servings<input type="number" required min="1" max="9999" value="2" id="base"></label><div id="lines">'+entry(true)+'</div><button class="outline" type="button" id="more">＋ Ingredient</button>','Save recipe',async()=>{let name=clean($('#recipeName').value),base=Number($('#base').value),lines=[];if(!name)throw Error('Enter a recipe name.');document.querySelectorAll('.fieldrow').forEach(el=>combine(lines,values(el)));if(!lines.length)throw Error('Add at least one ingredient.');await change(()=>state.recipes.push({name,kind:'custom',base,serves:base,lines}));notify('Recipe added.')});$('#more').onclick=()=>$('#lines').insertAdjacentHTML('beforeend',entry(true));$('#lines').onclick=e=>{if(e.target.matches('.remove'))e.target.closest('.fieldrow').remove()}}
$('#fields').onchange=e=>{if(e.target.matches('.nm')){let p=state.pantry.find(l=>l.name.toLowerCase()===clean(e.target.value).toLowerCase());if(p)e.target.closest('.fieldrow').querySelector('.unit').value=p.unit}};
$('#recipes').onclick=async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.step){let i=b.dataset.i;try{await change(()=>{let r=state.recipes[i];r.serves=Math.min(9999,Math.max(1,r.serves+Number(b.dataset.step)))});document.querySelector('[data-i="'+i+'"][data-step="'+b.dataset.step+'"]').focus()}catch(err){notify(err.message)}return}
 let i=b.dataset.cook,r=state.recipes[i],serves=r.serves;modal('Confirm meal','<h3>'+esc(r.name)+'</h3><p>Cooking '+serves+' serving'+(serves===1?'':'s')+' will use these pantry ingredients.</p>'+plan(r).map(l=>'<div class="row"><span>'+esc(l.name)+'</span><b>'+amt(l.need,l.unit)+'</b></div>').join(''),'Confirm & cook',async()=>{await change(()=>{let current=state.recipes[i];if(current.serves!==serves)throw Error('Servings changed. Close and review the meal again.');let lines=plan(current);if(lines.some(l=>l.short))throw Error('Pantry quantities changed. Close and review the shortages.');lines.forEach(l=>l.stock.q=pack(l.left))});notify(r.name+' confirmed. Pantry updated.')})};
window.addEventListener('storage',e=>{if(e.key===key){state=load();render()}});
try{state=load();render()}catch{notify('Kitchen storage is unavailable. Allow local browser storage to use this picker.')}
</script></body></html>
