<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arrival planner · Museum education desk</title><style>
*{box-sizing:border-box} :root{--ink:#282a25;--muted:#63665e;--line:#d5d3c8;--paper:#faf9f4;--gold:#edd6a6}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 "Helvetica Neue",Arial,sans-serif}header{height:68px;background:#252922;color:#fffdf3;padding:0 max(5vw,calc((100vw - 1260px)/2));display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font:bold 21px Georgia,serif}.brand svg{width:33px;color:#ebce8f}.brand span{font:24px Georgia;color:#898c80}.brand small,.offline{font:14px Arial}.offline{display:flex;gap:9px;align-items:center;color:#edece3}.offline i{width:8px;height:8px;border-radius:100%;background:#bfd5a6}main{max-width:1380px;margin:auto;padding:28px 5% 32px}.hero{position:relative;background:var(--gold);border:1px solid #d7c094;overflow:hidden;border-radius:9px;padding:30px 34px;display:flex;align-items:center;min-height:148px}.hero div{position:relative;z-index:1}.hero p{margin:6px 0 0;color:#514b3b}.facade{position:absolute;right:1%;bottom:-4px;height:96%;color:#7f6b41}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:normal}h1{font-size:clamp(44px,5vw,70px);letter-spacing:-.058em;line-height:1.06}h2{font-size:32px;letter-spacing:-.045em}.summary{display:flex;align-items:center;gap:25px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}.summary b{color:var(--ink)}.status{margin-left:auto;color:#365f46}.warn{color:#954128}.sectitle,.actions,.dialogbuttons{display:flex;align-items:center;justify-content:space-between;gap:10px}.sectitle{margin-bottom:14px}.booksection{margin:29px 0 31px}button{cursor:pointer;font:600 14px Arial;color:var(--ink);background:#fffef9;border:1px solid #c5c5b9;border-radius:5px;padding:10px 15px}button:hover{filter:brightness(.95)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #38689b;outline-offset:2px}.primary{background:#30392d;color:white;border-color:#30392d}#bookings{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{border:1px solid var(--line);border-radius:7px;background:#fffefa;padding:17px 19px;text-align:left;width:100%;font-weight:normal;display:grid;grid-template-columns:1fr auto;gap:7px}.card h3{font-size:23px;letter-spacing:-.03em}.card small,.sub,footer{color:var(--muted);font-size:13px}.card .time{font:600 12px ui-monospace,monospace;background:#f2f0e8;border-radius:4px;padding:4px 8px;align-self:start}.tag{font:600 11px Arial;letter-spacing:.07em;text-transform:uppercase}.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;background:var(--accent)}.arrow{grid-column:2;grid-row:3;color:#686c61;justify-self:end}.card h3,.card small{grid-column:1}.scroll{overflow:auto;border:1px solid var(--line);border-radius:7px}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{text-align:left;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;vertical-align:top}th:last-child,td:last-child{border-right:0}tbody tr:last-child>*{border-bottom:0}thead th{background:#eeeee5;font:normal 19px Georgia;padding:14px 16px}thead small{display:block;color:var(--muted);font:12px Arial;margin-top:5px}th:first-child{width:94px}tbody th{font:600 14px ui-monospace,monospace;padding:20px 14px}td{background:#fffefa}.slot{display:block;text-align:left;background:var(--tint);border:0;border-left:3px solid var(--accent);border-radius:4px;width:100%;padding:9px 12px}.slot+.slot{margin-top:5px}.slot span{display:block;font:12px Arial;margin-top:4px}.empty{color:#aaa99c;display:block;padding:8px}.sub{margin-top:2px}footer{padding-top:14px}#issues ul{border:1px solid #d4a18c;border-radius:6px;background:#fff2e9;padding:12px 32px}.flag{color:#91371e;font-weight:bold!important}dialog{width:min(510px,94vw);max-height:90dvh;border:1px solid var(--line);border-radius:9px;background:var(--paper);padding:24px;color:var(--ink)}dialog::backdrop{background:#20251dc0}.close{font-size:22px;border:0;background:transparent}.dialogbuttons{justify-content:flex-end;margin-top:18px}label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}input,select{display:block;width:100%;border:1px solid #aaa99b;border-radius:4px;background:white;padding:9px;font:16px Arial;color:var(--ink)}fieldset{border:0;padding:0;margin:18px 0}legend{font:bold 15px Arial}.sg{display:grid;grid-template-columns:1fr 85px auto;gap:8px;align-items:end}.sg button{margin-bottom:5px}.minor{margin-top:10px}.check{display:flex;gap:9px;align-items:center;font-weight:normal}.check input{width:auto}.danger{color:#973c26}.hint{font-size:13px;color:var(--muted);margin-top:5px}#error{color:#953b23}#paper{display:none}button,td,h3,li{overflow-wrap:anywhere}
@media(max-width:800px){.facade{opacity:.47;right:-80px}.hero div{max-width:70%}#bookings{gap:8px}.card{padding:12px}.card h3{font-size:20px}.summary{gap:12px}}
@media(max-width:620px){header{padding:0 4%;height:56px}.brand{gap:6px}.offline{font-size:11px}.hero{padding:22px 17px}.hero div{max-width:78%}.facade{right:-165px}.summary{flex-wrap:wrap;font-size:12px}.status{margin-left:0}#bookings{grid-template-columns:1fr}.card{gap:3px}.booksection{margin:20px 0}.sectitle{flex-wrap:wrap}#board{min-width:680px}h2{font-size:28px}}
@media print{@page{margin:14mm}header,main,dialog{display:none!important}body{background:white;color:black}#paper{display:block}#paper h1{font-size:30pt}#paper h2{font-size:18pt;margin:16pt 0 5pt}#paper table{table-layout:auto;font-size:10pt}#paper th,#paper td{width:auto;font:inherit;padding:5pt;border:1px solid #aaa}#paper th{font-weight:bold}#paper tr{break-inside:avoid}#paper thead{display:table-header-group}}
</style></head><body>
<header><div class="brand"><svg viewBox="0 0 36 36" aria-hidden="true"><path d="M2 30V8l8-4 8 6 8-6 8 4v22h-7V14l-9 7-9-7v16z" fill="currentColor"/></svg> Museum <span>/</span> <small>Education desk</small></div><span class="offline"><i></i> Offline workspace</span></header>
<main><section class="hero"><div><h1>Arrival planner</h1><p>Coordinate group arrivals, spaces, and activities.</p></div><svg class="facade" viewBox="0 0 380 160" aria-hidden="true"><defs><pattern id="arch" width="58" height="118" patternUnits="userSpaceOnUse"><path d="M2 118V50a27 27 0 0 1 54 0v68M8 118V50a21 21 0 0 1 42 0v68M14 118V50a15 15 0 0 1 30 0v68M0 58h17m24 0h17M0 63h17m24 0h17" /></pattern></defs><g fill="none" stroke="currentColor" stroke-width="1.3"><path d="m10 147 26-13h344M20 153l26-13h334M30 159l26-13h324M46 134V22L164 2l202 13v119M46 22l118-13 202 12M46 28l118-12 202 11M46 35l118-9 202 7M164 26v108M56 134V39l100-7v102"/><path fill="url(#arch)" d="M166 33h198v101H166z" transform="translate(0 0)"/><path d="M66 133V59l14-2v76m14 0V56l14-2v79m14 0V53l14-2v82M35 134h343"/></g></svg></section>
<div class="summary" id="summary"></div><section class="booksection"><div class="sectitle"><h2>Bookings</h2><button data-act="booking">+ Add booking</button></div><div id="bookings"></div></section>
<section><div class="sectitle"><div><h2>Activity schedule</h2><p class="sub">30-minute activities by space</p></div><div class="actions"><button data-act="print">Print schedule</button><button class="primary" data-act="activity">+ Assign activity</button></div></div><div id="issues" aria-live="polite"></div><div class="scroll"><table id="board"></table></div></section><footer id="save"></footer></main><article id="paper"></article><dialog><form id="form"><div class="sectitle"><h2 id="title"></h2><button class="close" type="button" aria-label="Close" data-act="close">×</button></div><div id="fields"></div><p role="alert" id="error"></p><div class="dialogbuttons"><button type="button" data-act="close">Cancel</button><button class="primary">Save changes</button></div></form></dialog><script>
'use strict';
const $ = s => document.querySelector(s);
const esc = v => String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rooms=[['Workshop room',18],['Gallery',24],['Courtyard',30]];
const palette=[['#9e5543','#f5e3dc'],['#657748','#e9eedf'],['#637c95','#e3ebf0']];
const key='museum-arrivals-v1';
const seed={bookings:[
 {id:'school',name:'School group',arrival:600,total:28,groups:[{id:'a',name:'School A',n:14},{id:'b',name:'School B',n:14}]},
 {id:'club',name:'Club',arrival:630,total:14,groups:[{id:'c',name:'Club group',n:14}]},
 {id:'family',name:'Family group',arrival:660,total:9,groups:[{id:'f',name:'Family group',n:9}]}
],activities:[['a',600,0],['b',600,1],['b',630,0],['a',630,1],['c',630,2],['f',660,0],['c',660,1]].map(([group,start,room],i)=>({id:'s'+i,group,start,room}))};
let state=structuredClone(seed),saveMessage='Draft saved on this device';
try{const saved=localStorage.getItem(key);if(saved)state=JSON.parse(saved);else localStorage.setItem(key,JSON.stringify(state))}catch{saveMessage='Local saving unavailable · keep this window open'}
const uid=()=>crypto.randomUUID();
const time=m=>[Math.floor(m/60),m%60].map(x=>String(x).padStart(2,'0')).join(':');
const minutes=s=>Number(s.slice(0,2))*60+Number(s.slice(3));
const color=i=>{const [a,t]=palette[i%palette.length];return '--accent:'+a+';--tint:'+t};
function entries(){
 const groups=new Map();
 state.bookings.forEach((b,i)=>b.groups.forEach(g=>groups.set(g.id,{b,g,i})));
 return state.activities.map(a=>({...a,...groups.get(a.group),warnings:[]})).sort((a,b)=>a.start-b.start||a.room-b.room);
}
function inspect(rows){
 for(const a of rows){
  const overlap=rows.filter(b=>b.id!==a.id&&a.start<b.start+30&&b.start<a.start+30);
  if(a.start<a.b.arrival)a.warnings.push('Starts before arrival at '+time(a.b.arrival));
  if(overlap.some(b=>b.group===a.group))a.warnings.push('Subgroup double-booked');
  const same=overlap.filter(b=>b.room===a.room);
  if(same.length)a.warnings.push('Space double-booked');
  const peak=Math.max(...[a.start,...same.map(b=>Math.max(a.start,b.start))].map(t=>a.g.n+same.filter(b=>b.start<=t&&t<b.start+30).reduce((n,b)=>n+b.g.n,0)));
  if(peak>rooms[a.room][1])a.warnings.push(peak+' visitors exceed capacity '+rooms[a.room][1]);
 }
}
function render(){
 const rows=entries();inspect(rows);
 const notices=rows.filter(a=>a.warnings.length).map(a=>time(a.start)+' · '+a.b.name+' / '+a.g.name+' · '+rooms[a.room][0]+' — '+a.warnings.join(', '));
 for(const b of state.bookings)for(const g of b.groups)if(!rows.some(a=>a.group===g.id))notices.push(b.name+' / '+g.name+' has no activity assigned.');
 const count=state.bookings.reduce((n,b)=>n+b.total,0);
 $('#summary').innerHTML='<span><b>'+state.bookings.length+'</b> bookings</span><span><b>'+count+'</b> visitors</span><span><b>'+rows.length+'</b> activities</span><span class="status '+(notices.length?'warn':'')+'">'+(notices.length?'⚠ Schedule needs attention':'✓ No scheduling conflicts')+'</span>';
 $('#bookings').innerHTML=state.bookings.map((b,i)=>'<button class="card" data-act="booking" data-id="'+b.id+'" style="'+color(i)+'"><span class="tag"><i class="dot"></i>Arrival</span><span class="time">'+time(b.arrival)+'</span><h3>'+esc(b.name)+'</h3><small>'+b.total+' visitors · '+b.groups.length+' subgroup'+(b.groups.length===1?'':'s')+'</small><span class="arrow" aria-hidden="true">↗</span></button>').join('');
 $('#issues').innerHTML=notices.length?'<ul>'+notices.map(n=>'<li>'+esc(n)+'</li>').join('')+'</ul>':'';
 const times=[...new Set(rows.map(a=>a.start))];
 $('#board').innerHTML='<thead><tr><th scope="col">Start</th>'+rooms.map(([r,n])=>'<th scope="col">'+r+'<small>'+n+' visitors max</small></th>').join('')+'</tr></thead><tbody>'+times.map(t=>'<tr><th scope="row">'+time(t)+'</th>'+rooms.map((_,i)=>'<td>'+(rows.filter(a=>a.start===t&&a.room===i).map(a=>'<button class="slot" data-act="activity" data-id="'+a.id+'" style="'+color(a.i)+'">'+esc(a.g.name)+'<span>'+a.g.n+' visitors · '+time(a.start)+'–'+time(a.start+30)+'</span>'+(a.warnings.length?'<span class="flag">⚠ Conflict</span>':'')+'</button>').join('')||'<span class="empty">—</span>')+'</td>').join('')+'</tr>').join('')+'</tbody>';
 $('#save').textContent=saveMessage;
 const table=(heads,body)=>'<table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+body.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
 $('#paper').innerHTML='<p>Museum / Education desk</p><h1>Front-desk schedule</h1><h2>Group arrivals</h2>'+table(['Arrival','Booking','Visitors','Subgroups'],[...state.bookings].sort((a,b)=>a.arrival-b.arrival).map(b=>[time(b.arrival),b.name,b.total,b.groups.map(g=>g.name+' ('+g.n+')').join(', ')]))+'<h2>Activities by time</h2>'+table(['Time','Booking','Subgroup','Visitors','Space'],rows.map(a=>[time(a.start)+'–'+time(a.start+30),a.b.name,a.g.name,a.g.n,rooms[a.room][0]]))+(notices.length?'<h2>Schedule needs attention</h2>'+$('#issues').innerHTML:'');
}
const dialog=$('dialog');
let active,editing;
function field(label,input){return '<label>'+label+input+'</label>'}
const input=(name,type,value,attrs='')=>'<input required name="'+name+'" type="'+type+'" value="'+esc(value)+'" '+attrs+'>';
function groupRow(g){return '<div class="sg" data-id="'+g.id+'">'+field('Subgroup name',input('gname','text',g.name,'maxlength="60"'))+field('Visitors',input('n','number',g.n,'min="1" max="9999"'))+'<button type="button" data-act="removeGroup" aria-label="Remove subgroup">×</button></div>'}
function openEditor(kind,id){
 active=kind;editing=id;$('#error').textContent='';
 if(kind==='booking'){
 const b=state.bookings.find(b=>b.id===id)||{name:'',total:1,arrival:600,groups:[{id:uid(),name:'Whole group',n:1}]};
 $('#title').textContent=id?'Edit booking':'Add booking';
 $('#fields').innerHTML=field('Booking name',input('bname','text',b.name,'maxlength="60"'))+field('Arrival time',input('arrival','time',time(b.arrival)))+(id?'<label class="check"><input type="checkbox" name="shift" checked> Move activities by the same time change</label>':'')+field('Total visitors',input('total','number',b.total,'min="1" max="9999"'))+'<fieldset><legend>Named subgroups</legend><p class="hint">Subgroup sizes must add up to the booking total.</p><div id="groups">'+b.groups.map(groupRow).join('')+'</div><button class="minor" type="button" data-act="addGroup">+ Add subgroup</button></fieldset>';
 }else{
 const a=state.activities.find(a=>a.id===id)||{group:state.bookings[0].groups[0].id,start:state.bookings[0].arrival,room:0};
 $('#title').textContent=id?'Edit activity':'Assign activity';
 $('#fields').innerHTML=field('Booking / subgroup','<select name="group">'+state.bookings.map(b=>'<optgroup label="'+esc(b.name)+'">'+b.groups.map(g=>'<option value="'+g.id+'" '+(a.group===g.id?'selected':'')+'>'+esc(b.name)+' / '+esc(g.name)+' ('+g.n+')</option>').join('')+'</optgroup>').join('')+'</select>')+field('Start time',input('start','time',time(a.start),'max="23:30"'))+'<p class="hint" id="timing"></p>'+field('Space','<select name="room">'+rooms.map(([r,n],i)=>'<option value="'+i+'" '+(a.room===i?'selected':'')+'>'+r+' · '+n+' visitors max</option>').join('')+'</select>')+(id?'<button type="button" class="danger minor" data-act="removeActivity">Remove activity</button>':'');
 timing();
 }
 dialog.showModal();
}
function timing(){const f=$('#form').elements,b=state.bookings.find(b=>b.groups.some(g=>g.id===f.group.value));$('#timing').textContent='Arrival '+time(b.arrival)+(f.start.value?' · Activity ends '+time(minutes(f.start.value)+30):'')}
function commit(){
 try{localStorage.setItem(key,JSON.stringify(state));saveMessage='Draft saved on this device'}catch{saveMessage='Local saving unavailable · keep this window open'}
 render();dialog.close();
}
document.addEventListener('click',e=>{
 const btn=e.target.closest('button[data-act]');if(!btn)return;
 const act=btn.dataset.act;
 if(act==='close')dialog.close();
 if(act==='booking'||act==='activity')openEditor(act,btn.dataset.id);
 if(act==='print')window.print();
 if(act==='addGroup'){$('#groups').insertAdjacentHTML('beforeend',groupRow({id:uid(),name:'',n:1}));$('#groups .sg:last-child input').focus()}
 if(act==='removeGroup'){
 const row=btn.closest('.sg');if(state.activities.some(a=>a.group===row.dataset.id))$('#error').textContent='Reassign or remove this subgroup’s activities before removing it.';else row.remove();
 }
 if(act==='removeActivity'){state.activities=state.activities.filter(a=>a.id!==editing);commit()}
});
$('#form').addEventListener('input',()=>{if(active==='activity')timing();$('#error').textContent=''});
$('#form').addEventListener('submit',e=>{
 e.preventDefault();const f=e.target.elements;
 const fail=msg=>$('#error').textContent=msg;
 if(active==='booking'){
 const groups=[...document.querySelectorAll('.sg')].map(row=>({id:row.dataset.id,name:row.querySelector('[name=gname]').value.trim(),n:Number(row.querySelector('[name=n]').value)}));
 const b={id:editing||uid(),name:f.bname.value.trim(),total:Number(f.total.value),arrival:minutes(f.arrival.value),groups};
 if(!b.name||groups.some(g=>!g.name))return fail('Enter a name for the booking and each subgroup.');
 if(new Set(groups.map(g=>g.name.toLowerCase())).size!==groups.length)return fail('Give each subgroup a distinct name.');
 if(groups.reduce((n,g)=>n+g.n,0)!==b.total)return fail('Subgroup sizes must add up to '+b.total+' visitors.');
 if(editing){
 const i=state.bookings.findIndex(b=>b.id===editing);
 const delta=f.shift.checked?b.arrival-state.bookings[i].arrival:0;
 const affected=state.activities.filter(a=>groups.some(g=>g.id===a.group));
 if(affected.some(a=>a.start+delta<0||a.start+delta+30>1440))return fail('Moving activities would cross midnight. Keep their times or choose another arrival.');
 affected.forEach(a=>a.start+=delta);state.bookings[i]=b;
 }else state.bookings.push(b);
 }else{
 const a={id:editing||uid(),group:f.group.value,start:minutes(f.start.value),room:Number(f.room.value)};
 if(editing)state.activities[state.activities.findIndex(x=>x.id===editing)]=a;else state.activities.push(a);
 }
 commit();
});
render();
</script></body></html>
